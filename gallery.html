<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cairo:wght=600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh; background: radial-gradient(circle, #fce4ec 0%, #f8bbd0 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Cairo', sans-serif; overflow: hidden; position: relative;
        }

        /* مطر القلوب العادية وقلوب رحمة */
        .falling { position: absolute; top: -50px; pointer-events: none; animation: fall linear infinite; z-index: 1; }
        .rahma-heart {
            background: #d81b60; color: white; padding: 6px 12px; border-radius: 20px;
            font-size: 0.9rem; font-weight: bold; font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 10px rgba(212, 28, 101, 0.3); position: absolute; white-space: nowrap;
        }
        .rahma-heart::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: #d81b60; }
        
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        /* تكبير الكلام والفقاعات عشان الموبايل */
        .story-line {
            position: absolute; padding: 14px 24px; border-radius: 25px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);
            font-size: 1.4rem; color: #5c0632; font-weight: 700; /* كبرنا الخط هنا */
            opacity: 0; transform: scale(0.6);
            box-shadow: 0 6px 20px rgba(212, 28, 101, 0.15);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            direction: rtl;
            width: max-content;
            white-space: nowrap;
        }
        .english-text { font-family: 'Caveat', cursive; font-size: 2.2rem; color: #d81b60; direction: ltr; }

        /* حاوية الصور المربعة الأصيلة */
        .gallery-container {
            display: none; grid-template-columns: repeat(2, 1fr); gap: 15px;
            z-index: 50; padding: 15px; background-color: #fdf2f4;
            background-image: url('https://www.transparenttextures.com/patterns/hearts.png');
            border-radius: 35px; border: 4px solid #ffffff;
            box-shadow: 0 20px 45px rgba(212, 28, 101, 0.2);
            width: 90%; max-width: 360px;
        }
        .img-box { width: 100%; aspect-ratio: 1 / 1; border-radius: 20px; border: 3px solid #fff; box-shadow: 0 6px 12px rgba(0,0,0,0.08); overflow: hidden; opacity: 0; transform: scale(0.5); transition: 0.6s; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .show-img { opacity: 1; transform: scale(1); }

        /* التوقيع */
        .animated-signature {
            position: absolute; bottom: 25px; font-family: 'Caveat', cursive;
            font-size: 2.4rem; color: #b80d4f; font-weight: bold; z-index: 60;
            opacity: 0; transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <audio id="storyMusic" autoplay loop>
        <source src="https://serv100.albumaty.com/song2022/Albumaty.Com_mhmd_alshrnwby_anty_alhyah_-_mn_mslsl_aygar_kdym.mp3" type="audio/mpeg">
    </audio>

    <div id="textContainer" style="width: 100%; height: 100%; position: absolute; top:0; left:0;"></div>

    <div class="gallery-container" id="galleryBox">
        <div class="img-box" id="img1"><img src="1.jpg"></div>
        <div class="img-box" id="img2"><img src="2.jpg"></div>
        <div class="img-box" id="img3"><img src="3.jpg"></div>
        <div class="img-box" id="img4"><img src="4.jpg"></div>
    </div>

    <div class="animated-signature" id="siteSig">By / Mohamed Sherif</div>

    <script>
        const audio = document.getElementById('storyMusic');
        audio.currentTime = 122; 

        document.addEventListener('click', () => { audio.play(); }, { once: true });

        const lines = [
            "كل سنه وانتي طيبه ينور عيني ♥️🫂",
            "كل سنه وانتي معايا وانا معاكي ♥️🫂",
            "كل سنه وانتي قارفانا ومجننانا 🙄😂",
            "Happy birthday ya Ro7y♥️🫂",
            "كل سنه وانتي منوره حياتنا بوجودك ♥️🫂",
            "احلي من تم 15 سنه يا احلي بنوته ♥️🫂",
            "طبعا هزهقك باللي قعدت اعمله ده 🙂😂",
            "كل سنه وانتي حبيبتي وبنتي واختي وصاحبتي ♥️🫂",
            "I Love yooou😘"
        ];

        function createFallingElements() {
            const items = ['🌸', '💖', '🌹', '✨', '❤️'];
            setInterval(() => {
                const isRahmaHeart = Math.random() > 0.7; 
                const el = document.createElement('div');
                
                if (isRahmaHeart) {
                    el.className = 'falling rahma-heart';
                    el.innerText = 'Rahma ♥️';
                } else {
                    el.className = 'falling';
                    el.innerText = items[Math.floor(Math.random() * items.length)];
                    el.style.fontSize = Math.random() * 20 + 15 + 'px';
                }
                
                el.style.left = Math.random() * 80 + 'vw';
                el.style.animationDuration = Math.random() * 2 + 4 + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 5500);
            }, 300);
        }

        function startStory() {
            createFallingElements();
            const container = document.getElementById('textContainer');
            
            lines.forEach((text, i) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'story-line' + (text.includes('Happy') || text.includes('Love') ? ' english-text' : '');
                    div.innerText = text;
                    
                    // توزيع متباعد ومريح عشان الخط بقا كبير
                    div.style.top = (10 + (i * 8.8)) + '%';
                    if (i === 8) {
                        div.style.left = '50%';
                        div.style.transform = 'translateX(-50%) scale(0.6)';
                    } else {
                        div.style.left = (i % 2 === 0) ? '4%' : 'auto';
                        div.style.right = (i % 2 === 0) ? 'auto' : '4%';
                    }
                    
                    container.appendChild(div);
                    
                    setTimeout(() => { 
                        if(i === 8) {
                            div.style.opacity = '1'; div.style.transform = 'translateX(-50%) scale(1)';
                        } else {
                            div.style.opacity = '1'; div.style.transform = 'scale(1)'; 
                        }
                    }, 50);
                }, i * 2000); 
            });

            setTimeout(() => {
                container.style.transition = 'opacity 0.3s ease'; 
                container.style.opacity = '0';
                
                setTimeout(() => {
                    container.style.display = 'none';
                    const gallery = document.getElementById('galleryBox');
                    gallery.style.display = 'grid'; 
                    
                    setTimeout(() => document.getElementById('img1').classList.add('show-img'), 100);
                    setTimeout(() => document.getElementById('img2').classList.add('show-img'), 500);
                    setTimeout(() => document.getElementById('img3').classList.add('show-img'), 900);
                    setTimeout(() => document.getElementById('img4').classList.add('show-img'), 1300);
                    
                    setTimeout(() => { document.getElementById('siteSig').style.opacity = '1'; }, 1800);
                }, 300);

            }, (lines.length - 1) * 2000 + 1500); 
        }

        window.onload = startStory;
    </script>
</body>
</html>
